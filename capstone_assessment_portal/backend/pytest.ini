[pytest]
; tells pytest where test files are located
testpaths = tests

; asyncio_mode = auto means pytest handles async functions automatically
; without this, async test functions would not work
asyncio_mode = auto

; only collect files matching this pattern
python_files = test_*.py

; only collect classes matching this pattern
python_classes = Test*

; only collect functions matching this pattern
python_functions = test_*

; show extra info when running tests
addopts = -v